name: Serving Combined Nightly Archive

on:
  pull_request:
    paths:
      - "python/yirage/serving/combined_nightly_archive.py"
      - "python/yirage/serving/decode_bench_archive.py"
      - "python/yirage/serving/engine_g1_regression.py"
      - "python/yirage/serving/engine_native_multistep_bench.py"
      - "python/yirage/serving/qwen_multistep_generation_bench.py"
      - "scripts/serving_combined_nightly_archive.py"
      - "scripts/validate_serving_combined_nightly_archive.py"
      - "benchmark/serving_combined_nightly_archive.py"
      - "benchmark/serving_engine_native_multistep_bench.py"
      - "tests/python/test_runtime_fusion_s34_combined_nightly.py"
      - "python/yirage/serving/serving_dashboard.py"
      - "scripts/render_serving_dashboard.py"
      - "benchmark/serving_dashboard.py"
      - "tests/python/test_runtime_fusion_s36_serving_dashboard.py"
      - "python/yirage/serving/vllm_paged_multistep_bench.py"
      - "benchmark/serving_vllm_paged_multistep_bench.py"
      - "tests/python/test_runtime_fusion_s37_vllm_paged_multistep.py"
      - "tests/python/test_runtime_fusion_s38_paged_multistep_archive.py"
      - "tests/python/test_runtime_fusion_s39_serving_dashboard_html.py"
      - "tests/python/test_runtime_fusion_s40_vllm_paged_native_multistep.py"
      - ".github/workflows/serving-combined-nightly-archive.yml"
  push:
    branches:
      - main
    paths:
      - "python/yirage/serving/combined_nightly_archive.py"
      - "python/yirage/serving/engine_native_multistep_bench.py"
      - "scripts/serving_combined_nightly_archive.py"
      - "scripts/validate_serving_combined_nightly_archive.py"
      - "benchmark/serving_combined_nightly_archive.py"
      - "benchmark/serving_engine_native_multistep_bench.py"
      - "tests/python/test_runtime_fusion_s34_combined_nightly.py"
      - "python/yirage/serving/serving_dashboard.py"
      - "scripts/render_serving_dashboard.py"
      - "benchmark/serving_dashboard.py"
      - "tests/python/test_runtime_fusion_s36_serving_dashboard.py"
      - "python/yirage/serving/vllm_paged_multistep_bench.py"
      - "benchmark/serving_vllm_paged_multistep_bench.py"
      - "tests/python/test_runtime_fusion_s37_vllm_paged_multistep.py"
      - "tests/python/test_runtime_fusion_s38_paged_multistep_archive.py"
      - "tests/python/test_runtime_fusion_s39_serving_dashboard_html.py"
      - "tests/python/test_runtime_fusion_s40_vllm_paged_native_multistep.py"
      - ".github/workflows/serving-combined-nightly-archive.yml"
  schedule:
    - cron: "0 7 * * *"

concurrency:
  group: serving-combined-nightly-archive-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  serving-combined-archive-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest torch --index-url https://download.pytorch.org/whl/cpu

      - name: S34–S40 combined archive + dashboard contract
        env:
          YIRAGE_BACKEND: cpu
          PYTHONPATH: python:tests/python
        run: |
          python3 -m pytest tests/python/test_runtime_fusion_s34_combined_nightly.py tests/python/test_runtime_fusion_s35_engine_native_multistep.py tests/python/test_runtime_fusion_s36_serving_dashboard.py tests/python/test_runtime_fusion_s37_vllm_paged_multistep.py tests/python/test_runtime_fusion_s38_paged_multistep_archive.py tests/python/test_runtime_fusion_s39_serving_dashboard_html.py tests/python/test_runtime_fusion_s40_vllm_paged_native_multistep.py -v -k "not slow" --tb=short
          python3 benchmark/serving_combined_nightly_archive.py --quick --g1-only --json
          python3 benchmark/serving_engine_native_multistep_bench.py --quick --no-native --json
          python3 benchmark/serving_dashboard.py --g1-only --json
          python3 benchmark/serving_vllm_paged_multistep_bench.py --quick --no-native --json

  serving-combined-archive-nightly:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev python3-pip libboost-all-dev libz3-dev libopenblas-dev build-essential curl

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build Rust search helpers
        run: |
          (cd src/search/abstract_expr/abstract_subexpr && cargo build --release --target-dir ../../../../build/abstract_subexpr)
          (cd src/search/verification/formal_verifier_equiv && cargo build --release --target-dir ../../../../build/formal_verifier)

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install z3-solver numpy graphviz tqdm transformers pytest
          python3 -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build YiRage CPU
        env:
          YIRAGE_BACKEND: cpu
        run: |
          python3 -m pip install -e . --no-build-isolation

      - name: Generate and validate combined nightly archive
        env:
          YIRAGE_BACKEND: cpu
          LD_LIBRARY_PATH: build/abstract_subexpr/release:build/formal_verifier/release
          PYTHONPATH: python:tests/python
        run: |
          mkdir -p artifacts
          make test-serving-combined-nightly-profile

      - name: Upload combined nightly archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: serving-combined-nightly-archive
          path: |
            artifacts/serving-combined-nightly.json
            artifacts/serving-combined-nightly.meta.json
            artifacts/serving-dashboard.json
            artifacts/serving-dashboard.md
            artifacts/serving-dashboard.html
