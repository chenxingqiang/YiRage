# YiRage CPU execution contract (single source of truth for certification).
# tier: supported | fast_path | experimental | unsupported
# layer: kn | tb | io | collective | layout

meta:
  version: 1
  description: >
    CPU certification uses this matrix. "supported" ops must pass runtime_verify
    vs torch. "unsupported" ops must raise NotImplementedError on cpu_call.
    "fast_path" ops may bypass the TB interpreter when pattern-matched.

kn_ops:
  kn_input_op: { tier: io, layer: kn }
  kn_output_op: { tier: io, layer: kn }
  kn_matmul_op:
    tier: fast_path
    layer: kn
    note: cpu_matmul → torch/MKL when plain input×input→matmul→output
  kn_rms_norm_op: { tier: supported, layer: kn }
  kn_exp_op: { tier: supported, layer: kn }
  kn_square_op: { tier: supported, layer: kn }
  kn_sqrt_op: { tier: supported, layer: kn }
  kn_silu_op: { tier: supported, layer: kn }
  kn_sigmoid_op: { tier: supported, layer: kn }
  kn_gelu_op: { tier: supported, layer: kn }
  kn_relu_op: { tier: supported, layer: kn }
  kn_log_op: { tier: supported, layer: kn }
  kn_add_op: { tier: supported, layer: kn }
  kn_sub_op: { tier: supported, layer: kn }
  kn_mul_op: { tier: supported, layer: kn }
  kn_div_op: { tier: supported, layer: kn }
  kn_pow_op: { tier: supported, layer: kn }
  kn_reduction_0_op: { tier: supported, layer: kn }
  kn_reduction_1_op: { tier: supported, layer: kn }
  kn_reduction_2_op: { tier: supported, layer: kn }
  kn_customized_op:
    tier: fast_path
    layer: kn
    note: semantic rms+matmul → cpu_rms_matmul; else TB interpreter
  kn_mul_scalar_op:
    tier: supported
    layer: kn
    note: scalar serialized in graph JSON
  kn_clamp_op:
    tier: supported
    layer: kn
    note: min_val/max_val serialized in graph JSON
  kn_concat_0_op:
    tier: supported
    layer: layout
    note: torch.cat along dim 0; CPU interpreter
  kn_concat_1_op:
    tier: supported
    layer: layout
    note: torch.cat along dim 1; CPU interpreter
  kn_concat_2_op:
    tier: supported
    layer: layout
    note: torch.cat along dim 2; CPU interpreter
  kn_split_0_op:
    tier: supported
    layer: layout
    note: binary torch.split along dim 0; CPU interpreter (first slice value-verified)
  kn_split_1_op:
    tier: supported
    layer: layout
    note: binary torch.split along dim 1; CPU interpreter (first slice value-verified)
  kn_split_2_op:
    tier: supported
    layer: layout
    note: binary torch.split along dim 2; CPU interpreter (first slice value-verified)
  kn_chunk_0_op:
    tier: supported
    layer: layout
    note: torch.chunk along dim 0; CPU interpreter (first slice value-verified)
  kn_chunk_1_op:
    tier: supported
    layer: layout
    note: torch.chunk along dim 1; CPU interpreter (first slice value-verified)
  kn_chunk_2_op:
    tier: supported
    layer: layout
    note: torch.chunk along dim 2; CPU interpreter (first slice value-verified)
  kn_transpose_01_op:
    tier: supported
    layer: layout
    note: swap dims 0 and 1; torch.transpose(0, 1); CPU interpreter + search explore
  kn_concat_then_matmul_op:
    tier: unsupported
    layer: layout
    note: search macro only (expands to concat+concat+matmul); enabled via get_cpu_search_config concat_matmul flag
  kn_allreduce_op: { tier: unsupported, layer: collective }
  kn_allgather_op: { tier: unsupported, layer: collective }
  kn_reduce_scatter_op: { tier: unsupported, layer: collective }
  kn_broadcast_op: { tier: unsupported, layer: collective }
  kn_p2p_send_op: { tier: unsupported, layer: collective }
  kn_p2p_recv_op: { tier: unsupported, layer: collective }

tb_ops:
  tb_input_op: { tier: io, layer: tb }
  tb_output_op: { tier: io, layer: tb }
  tb_matmul_op: { tier: supported, layer: tb }
  tb_rms_norm_op: { tier: supported, layer: tb }
  tb_exp_op: { tier: supported, layer: tb }
  tb_square_op: { tier: supported, layer: tb }
  tb_sqrt_op: { tier: supported, layer: tb }
  tb_silu_op: { tier: supported, layer: tb }
  tb_sigmoid_op: { tier: supported, layer: tb }
  tb_gelu_op: { tier: supported, layer: tb }
  tb_relu_op: { tier: supported, layer: tb }
  tb_log_op: { tier: supported, layer: tb }
  tb_add_op: { tier: supported, layer: tb }
  tb_mul_op: { tier: supported, layer: tb }
  tb_div_op: { tier: supported, layer: tb }
  tb_sub_op: { tier: supported, layer: tb }
  tb_pow_op: { tier: supported, layer: tb }
  tb_reduction_0_op: { tier: supported, layer: tb }
  tb_reduction_1_op: { tier: supported, layer: tb }
  tb_reduction_2_op: { tier: supported, layer: tb }
  tb_reduction_0_to_dimx_op: { tier: supported, layer: tb }
  tb_reduction_1_to_dimx_op: { tier: supported, layer: tb }
  tb_reduction_2_to_dimx_op: { tier: supported, layer: tb }
  tb_reduction_0_max_op:
    tier: supported
    layer: tb
    note: dual outputs (max + diff); CPU interpreter + search explore
  tb_reduction_1_max_op:
    tier: supported
    layer: tb
    note: dual outputs (max + diff); CPU interpreter + search explore
  tb_reduction_2_max_op:
    tier: supported
    layer: tb
    note: dual outputs (max + diff); CPU interpreter + search explore
  tb_forloop_accum_no_red_op: { tier: supported, layer: tb }
  tb_forloop_accum_red_ld_rms_op: { tier: supported, layer: tb }
  tb_forloop_accum_red_ld_sum_op:
    tier: supported
    layer: tb
    note: per-tile reduce-sum along last dim, accumulated across forloop
  tb_mul_scalar_op:
    tier: supported
    layer: tb
    note: scalar serialized in graph JSON
  tb_clamp_op:
    tier: supported
    layer: tb
    note: min_val/max_val serialized in graph JSON
  tb_forloop_accum_red_ld_mean_op:
    tier: supported
    layer: tb
    note: per-tile reduce-sum along last dim, mean epilogue on last forloop iter
  tb_forloop_accum_redtox_ld_sum_op:
    tier: supported
    layer: tb
    note: per-tile reduction_to_dimx sum on last dim, accumulated across forloop
  tb_forloop_accum_max_op:
    tier: supported
    layer: tb
    note: elementwise max across forloop tiles (same shape as input tile)
  tb_forloop_accum_no_red_rescale_op:
    tier: supported
    layer: tb
    note: online softmax rescale; acc = acc * rescale + src (FlashAttention-style); search explore deferred
  tb_forloop_accum_red_ld_sum_rescale_op:
    tier: supported
    layer: tb
    note: reduce-sum along last dim then acc = acc * rescale + partial; search explore deferred
  tb_concat_0_op:
    tier: supported
    layer: layout
    note: torch.cat along dim 0; CPU interpreter + search explore
  tb_concat_1_op:
    tier: supported
    layer: layout
    note: torch.cat along dim 1; CPU interpreter + search explore
  tb_concat_2_op:
    tier: supported
    layer: layout
    note: torch.cat along dim 2; CPU interpreter + search explore
  tb_split_0_op:
    tier: supported
    layer: layout
    note: binary torch.split along dim 0; CPU interpreter (first slice value-verified)
  tb_split_1_op:
    tier: supported
    layer: layout
    note: binary torch.split along dim 1; CPU interpreter (first slice value-verified)
  tb_split_2_op:
    tier: supported
    layer: layout
    note: binary torch.split along dim 2; CPU interpreter (first slice value-verified)
  tb_chunk_0_op:
    tier: supported
    layer: layout
    note: torch.chunk along dim 0; CPU interpreter + search explore
  tb_chunk_1_op:
    tier: supported
    layer: layout
    note: torch.chunk along dim 1; CPU interpreter + search explore
  tb_chunk_2_op:
    tier: supported
    layer: layout
    note: torch.chunk along dim 2; CPU interpreter + search explore
  tb_concat_then_matmul_op:
    tier: unsupported
    layer: layout
    note: search macro only (expands to concat+matmul); enabled via get_cpu_search_config concat_matmul flag

# KN/TB layout chunk symmetry documented via cpu_layout_explore_gap_table() (R53/R54).

